<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Diagnóstico de índices do Hub</title></head><body>
<h1>Diagnóstico local de índices</h1><p>Somente metadados; não exibe registros, credenciais ou valores de usuários.</p>
<button id="indexes">Ler índices</button> <button id="generator">Verificar próximo ID com transação revertida</button> <button id="download" disabled>Baixar metadados</button>
<pre id="result" aria-live="polite">Aguardando.</pre>
<script type="module">
const $=id=>document.getElementById(id), out=$('result');let capturedIndexes=null,capturedGenerator=null;
async function existing(name){const names=await indexedDB.databases();if(!names.some(d=>d.name===name))throw Error('Banco ausente');return new Promise((resolve,reject)=>{const r=indexedDB.open(name);r.onupgradeneeded=()=>{r.transaction.abort();reject(Error('Abertura cancelada'))};r.onerror=()=>reject(Error('Falha ao abrir banco'));r.onblocked=()=>reject(Error('Banco ocupado'));r.onsuccess=()=>resolve(r.result)})}
async function indexes(){const databases=await indexedDB.databases(),result=[];for(const item of databases){if(!item.name)continue;const db=await existing(item.name);try{const names=Array.from(db.objectStoreNames);if(!names.length){result.push({database:item.name,version:db.version,stores:[]});continue}const tx=db.transaction(names,'readonly');const stores=names.map(name=>{const store=tx.objectStore(name);return{name,keyPath:store.keyPath,autoIncrement:store.autoIncrement,indexes:Array.from(store.indexNames).map(id=>{const i=store.index(id);return{name:i.name,keyPath:i.keyPath,unique:i.unique,multiEntry:i.multiEntry}})}});await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onabort=tx.onerror=()=>reject(Error('Leitura interrompida'))});result.push({database:item.name,version:db.version,stores})}finally{db.close()}}return result}
async function generator(){const db=await existing('hub-tracking-clicks');try{return await new Promise((resolve,reject)=>{const tx=db.transaction('report_snapshots','readwrite'),store=tx.objectStore('report_snapshots');let next,abortRequested=false;if(!store.autoIncrement){tx.abort();reject(Error('Store sem autoincremento'));return}tx.oncomplete=()=>reject(Error('ERRO: transação confirmada inesperadamente'));tx.onabort=()=>abortRequested&&Number.isSafeInteger(next)?resolve({next,rolledBack:true}):reject(Error('Transação cancelada sem resultado'));tx.onerror=()=>{};try{const r=store.add({});r.onsuccess=()=>{next=r.result;abortRequested=true;tx.abort()};r.onerror=()=>{try{tx.abort()}catch{}}}catch(e){try{tx.abort()}catch{};reject(e)}})}finally{db.close()}}
$('indexes').onclick=async()=>{out.textContent='Lendo índices...';try{capturedIndexes=await indexes();$('download').disabled=false;out.textContent=JSON.stringify({indexes:capturedIndexes})}catch(e){out.textContent='Erro: '+e.message}};
$('generator').onclick=async()=>{out.textContent='Verificando gerador...';try{capturedGenerator=await generator();out.textContent=JSON.stringify({generator:capturedGenerator})}catch(e){out.textContent='Erro: '+e.message}};
$('download').onclick=()=>{if(!capturedIndexes)return;const blob=new Blob([JSON.stringify({schema:'hub-index-metadata-v1',capturedAtUtc:new Date().toISOString(),origin:location.origin,indexes:capturedIndexes,generator:capturedGenerator})],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hub-diagnostico-indices-metadados.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
